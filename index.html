<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beranda Dinamis - Google Sheets DB</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background-color: #f4f6f9; }
    .card-menu { transition: all 0.3s ease; border-radius: 12px; }
    .card-menu:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
    .icon-box { font-size: 2.2rem; }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#"><i class="bi bi-grid-fill me-2"></i>Portal Beranda</a>
      <div class="d-flex align-items-center gap-2">
        <span id="userStatus" class="badge bg-light text-primary">Mode Tamu</span>
        <button id="btnLoginModal" class="btn btn-outline-light btn-sm" data-bs-toggle="modal" data-bs-target="#loginModal">
          <i class="bi bi-box-arrow-in-right me-1"></i>Login Admin
        </button>
        <button id="btnLogout" class="btn btn-danger btn-sm d-none" onclick="logout()">
          <i class="bi bi-box-arrow-right me-1"></i>Logout
        </button>
      </div>
    </div>
  </nav>

  <div class="container my-4">
    <!-- Panel Admin -->
    <div id="adminPanel" class="card mb-4 border-0 shadow-sm d-none">
      <div class="card-body bg-white rounded-3 d-flex justify-content-between align-items-center">
        <div>
          <h5 class="card-title mb-1 text-primary"><i class="bi bi-shield-lock-fill me-2"></i>Panel Kontrol Admin</h5>
          <p class="text-muted small mb-0">Kelola menu dinamis dengan Google Sheets.</p>
        </div>
        <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#addMenuModal">
          <i class="bi bi-plus-lg me-1"></i>Tambah Menu
        </button>
      </div>
    </div>

    <!-- Filter Pencarian -->
    <div class="row align-items-center mb-4 g-2">
      <div class="col-md-6">
        <div class="input-group">
          <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
          <input type="text" id="searchInput" class="form-control" placeholder="Cari menu..." onkeyup="renderMenu()">
        </div>
      </div>
      <div class="col-md-6 text-md-end">
        <span class="text-muted small"><i class="bi bi-cloud-check me-1"></i>Database Google Sheets</span>
      </div>
    </div>

    <!-- Container Grid Menu -->
    <div id="menuContainer" class="row g-3">
      <div class="text-center my-5">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="mt-2 text-muted">Menghubungkan ke Google Sheets...</p>
      </div>
    </div>
  </div>

  <!-- Modal Login -->
  <div class="modal fade" id="loginModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-sm">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title"><i class="bi bi-person-lock me-2"></i>Login Admin</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="loginAlert" class="alert alert-danger d-none p-2 small text-center"></div>
          <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="mb-3">
              <label class="form-label">Username</label>
              <input type="text" id="loginUser" class="form-control" required placeholder="admin">
            </div>
            <div class="mb-3">
              <label class="form-label">Password</label>
              <input type="password" id="loginPass" class="form-control" required placeholder="admin123">
            </div>
            <button type="submit" id="btnLoginSubmit" class="btn btn-primary w-100">Login</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Tambah Menu -->
  <div class="modal fade" id="addMenuModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title"><i class="bi bi-plus-circle me-2"></i>Tambah Menu Baru</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="addMenuForm" onsubmit="handleAddMenu(event)">
            <div class="mb-3">
              <label class="form-label">Judul Menu</label>
              <input type="text" id="menuTitle" class="form-control" required placeholder="Contoh: Aplikasi Absensi">
            </div>
            <div class="mb-3">
              <label class="form-label">Deskripsi Singkat</label>
              <input type="text" id="menuDesc" class="form-control" required placeholder="Penjelasan singkat">
            </div>
            <div class="mb-3">
              <label class="form-label">Link (URL)</label>
              <input type="url" id="menuUrl" class="form-control" required placeholder="https://...">
            </div>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">Ikon (Bootstrap Icon)</label>
                <input type="text" id="menuIcon" class="form-control" value="bi-link-45deg">
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Lebar Grid</label>
                <select id="menuCols" class="form-select">
                  <option value="3">4 Kolom (col-md-3)</option>
                  <option value="4" selected>3 Kolom (col-md-4)</option>
                  <option value="6">2 Kolom (col-md-6)</option>
                  <option value="12">1 Kolom Penuh (col-md-12)</option>
                </select>
              </div>
            </div>
            <button type="submit" id="btnAddSubmit" class="btn btn-primary w-100">Simpan ke Google Sheets</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Edit Menu -->
  <div class="modal fade" id="editMenuModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title"><i class="bi bi-pencil-square me-2"></i>Edit Menu</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="editMenuForm" onsubmit="handleUpdateMenu(event)">
            <input type="hidden" id="editMenuId">
            <div class="mb-3">
              <label class="form-label">Judul Menu</label>
              <input type="text" id="editMenuTitle" class="form-control" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Deskripsi Singkat</label>
              <input type="text" id="editMenuDesc" class="form-control" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Link (URL)</label>
              <input type="url" id="editMenuUrl" class="form-control" required>
            </div>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">Ikon (Bootstrap Icon)</label>
                <input type="text" id="editMenuIcon" class="form-control" required>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Lebar Grid</label>
                <select id="editMenuCols" class="form-select">
                  <option value="3">4 Kolom (col-md-3)</option>
                  <option value="4">3 Kolom (col-md-4)</option>
                  <option value="6">2 Kolom (col-md-6)</option>
                  <option value="12">1 Kolom Penuh (col-md-12)</option>
                </select>
              </div>
            </div>
            <button type="submit" id="btnEditSubmit" class="btn btn-primary w-100">Perbarui di Google Sheets</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // TEMPELKAN URL WEB APP GOOGLE APPS SCRIPT ANDA DI SINI
    const API_URL = "https://script.google.com/macros/s/AKfycby_uQHTapK3jvLa74QtWxP_0SxXEAj5MQ6O4lvNl8ZH-s0-htWJosMrWZxCbtGbzqDnJw/exec";

    let menuList = [];
    let isAdmin = false;

    document.addEventListener("DOMContentLoaded", () => {
      checkLoginSession();
      fetchMenu();
    });

    function checkLoginSession() {
      isAdmin = sessionStorage.getItem("isAdmin") === "true";
      const userStatus = document.getElementById("userStatus");
      const adminPanel = document.getElementById("adminPanel");
      const btnLoginModal = document.getElementById("btnLoginModal");
      const btnLogout = document.getElementById("btnLogout");

      if (isAdmin) {
        userStatus.className = "badge bg-warning text-dark";
        userStatus.innerText = "Mode Admin";
        adminPanel.classList.remove("d-none");
        btnLoginModal.classList.add("d-none");
        btnLogout.classList.remove("d-none");
      } else {
        userStatus.className = "badge bg-light text-primary";
        userStatus.innerText = "Mode Tamu";
        adminPanel.classList.add("d-none");
        btnLoginModal.classList.remove("d-none");
        btnLogout.classList.add("d-none");
      }
    }

    async function fetchMenu() {
      const container = document.getElementById("menuContainer");
      if (!API_URL || API_URL.includes("URL_WEB_APP_APPS_SCRIPT_ANDA_DI_SINI")) {
        container.innerHTML = `<div class="alert alert-warning text-center">Harap atur variabel API_URL terlebih dahulu.</div>`;
        return;
      }

      try {
        const response = await fetch(API_URL + "?sheet=Menu");
        menuList = await response.json();
        renderMenu();
      } catch (err) {
        container.innerHTML = `<div class="alert alert-danger text-center">Gagal memuat data dari Spreadsheet.</div>`;
      }
    }

    function renderMenu() {
      const container = document.getElementById("menuContainer");
      const query = document.getElementById("searchInput").value.toLowerCase();
      
      const filtered = menuList.filter(m => 
        (m.title && m.title.toString().toLowerCase().includes(query)) || 
        (m.description && m.description.toString().toLowerCase().includes(query))
      );

      if (filtered.length === 0) {
        container.innerHTML = `<div class="text-center my-5 text-muted"><i class="bi bi-inbox fs-1 d-block mb-2"></i><p>Tidak ada data menu.</p></div>`;
        return;
      }

      container.innerHTML = filtered.map(item => `
        <div class="col-12 col-md-${item.cols || 4}">
          <div class="card card-menu h-100 border-0 shadow-sm">
            <div class="card-body d-flex flex-column justify-content-between p-4">
              <div>
                <div class="d-flex align-items-center justify-content-between mb-3">
                  <span class="icon-box text-primary"><i class="bi ${item.icon || 'bi-link-45deg'}"></i></span>
                  ${isAdmin ? `
                    <div class="btn-group">
                      <button class="btn btn-outline-secondary btn-sm border-0" title="Edit Menu" onclick='openEditModal(${JSON.stringify(item)})'><i class="bi bi-pencil-square"></i></button>
                      <button class="btn btn-outline-danger btn-sm border-0" title="Hapus Menu" onclick="deleteMenu('${item.id}')"><i class="bi bi-trash"></i></button>
                    </div>
                  ` : ''}
                </div>
                <h5 class="card-title fw-bold text-dark">${item.title}</h5>
                <p class="card-text text-muted small">${item.description}</p>
              </div>
              <a href="${item.url}" target="_blank" class="btn btn-outline-primary btn-sm w-100 mt-3 fw-semibold">
                Buka Link <i class="bi bi-box-arrow-up-right ms-1"></i>
              </a>
            </div>
          </div>
        </div>
      `).join('');
    }

    async function handleLogin(e) {
      e.preventDefault();
      const user = document.getElementById("loginUser").value;
      const pass = document.getElementById("loginPass").value;
      const btn = document.getElementById("btnLoginSubmit");
      const alertBox = document.getElementById("loginAlert");

      alertBox.classList.add("d-none");
      btn.disabled = true;
      btn.innerText = "Memeriksa...";

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify({ action: "login", username: user, password: pass })
        });
        const res = await response.json();

        if (res.success) {
          sessionStorage.setItem("isAdmin", "true");
          checkLoginSession();
          bootstrap.Modal.getInstance(document.getElementById("loginModal")).hide();
          document.getElementById("loginForm").reset();
          renderMenu();
        } else {
          alertBox.innerText = res.message;
          alertBox.classList.remove("d-none");
        }
      } catch (err) {
        alertBox.innerText = "Gagal terhubung ke server.";
        alertBox.classList.remove("d-none");
      } finally {
        btn.disabled = false;
        btn.innerText = "Login";
      }
    }

    function logout() {
      sessionStorage.removeItem("isAdmin");
      checkLoginSession();
      renderMenu();
    }

    async function handleAddMenu(e) {
      e.preventDefault();
      const btn = document.getElementById("btnAddSubmit");
      btn.disabled = true;
      btn.innerText = "Menyimpan...";

      const newMenu = {
        action: "addMenu",
        title: document.getElementById("menuTitle").value,
        description: document.getElementById("menuDesc").value,
        url: document.getElementById("menuUrl").value,
        icon: document.getElementById("menuIcon").value,
        cols: document.getElementById("menuCols").value
      };

      try {
        await fetch(API_URL, { method: "POST", body: JSON.stringify(newMenu) });
        document.getElementById("addMenuForm").reset();
        bootstrap.Modal.getInstance(document.getElementById("addMenuModal")).hide();
        await fetchMenu();
      } catch (err) {
        alert("Gagal menambah menu.");
      } finally {
        btn.disabled = false;
        btn.innerText = "Simpan ke Google Sheets";
      }
    }

    // Fungsi untuk membuka modal edit dan mengisi datanya otomatis
    function openEditModal(item) {
      document.getElementById("editMenuId").value = item.id;
      document.getElementById("editMenuTitle").value = item.title;
      document.getElementById("editMenuDesc").value = item.description;
      document.getElementById("editMenuUrl").value = item.url;
      document.getElementById("editMenuIcon").value = item.icon;
      document.getElementById("editMenuCols").value = item.cols || 4;

      const editModal = new bootstrap.Modal(document.getElementById("editMenuModal"));
      editModal.show();
    }

    // Fungsi untuk mengirim data edit ke Google Sheets
    async function handleUpdateMenu(e) {
      e.preventDefault();
      const btn = document.getElementById("btnEditSubmit");
      btn.disabled = true;
      btn.innerText = "Memperbarui...";

      const updatedMenu = {
        action: "updateMenu",
        id: document.getElementById("editMenuId").value,
        title: document.getElementById("editMenuTitle").value,
        description: document.getElementById("editMenuDesc").value,
        url: document.getElementById("editMenuUrl").value,
        icon: document.getElementById("editMenuIcon").value,
        cols: document.getElementById("editMenuCols").value
      };

      try {
        await fetch(API_URL, { method: "POST", body: JSON.stringify(updatedMenu) });
        bootstrap.Modal.getInstance(document.getElementById("editMenuModal")).hide();
        await fetchMenu();
      } catch (err) {
        alert("Gagal memperbarui menu.");
      } finally {
        btn.disabled = false;
        btn.innerText = "Perbarui di Google Sheets";
      }
    }

    async function deleteMenu(id) {
      if (!confirm("Hapus menu ini dari Google Sheets?")) return;

      try {
        await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "deleteMenu", id: id }) });
        await fetchMenu();
      } catch (err) {
        alert("Gagal menghapus menu.");
      }
    }
  </script>
</body>
</html>
